<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マッハ車検 愛知三好店 | 車検だけじゃない、鈑金修理も対応</title>
<style>
  :root{
    --yellow:#ffd400;
    --black:#1a1a1a;
    --red:#e8341c;
    --gray:#f5f5f5;
    --darkgray:#555;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    color:var(--black);
    line-height:1.7;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 16px;}
  a{text-decoration:none;color:inherit;}

  /* Top bar */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    background:var(--black);
    color:#fff;
    padding:12px 20px;
  }
  .topbar .logo{font-weight:bold;font-size:1.1rem;}
  .topbar .tel{
    text-align:right;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--yellow);
  }
  .topbar .tel span{display:block;font-size:0.75rem;color:#ddd;font-weight:normal;}

  /* Hero */
  .hero{
    background:var(--yellow);
    color:var(--black);
    text-align:center;
    padding:60px 16px 50px;
  }
  .hero .badge{
    display:inline-block;
    background:var(--red);
    color:#fff;
    font-weight:bold;
    font-size:0.9rem;
    padding:6px 18px;
    border-radius:20px;
    margin-bottom:18px;
  }
  .hero h1{
    font-size:1.9rem;
    margin:0 0 10px;
    line-height:1.4;
  }
  .hero h1 .accent{color:var(--red);}
  .hero p.sub{font-size:1rem;color:#333;margin-bottom:28px;}
  .cta-btn{
    display:inline-block;
    background:var(--red);
    color:#fff;
    font-weight:bold;
    font-size:1.1rem;
    padding:16px 40px;
    border-radius:6px;
    margin-top:24px;
    box-shadow:0 4px 0 rgba(0,0,0,0.3);
  }
  .cta-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:24px;}
  .cta-row .cta-btn{margin-top:0;}
  .cta-btn-outline{
    display:inline-block;
    background:var(--black);
    color:#fff;
    font-weight:bold;
    font-size:1.1rem;
    padding:16px 32px;
    border-radius:6px;
    border:2px solid var(--black);
  }

  /* Sections */
  section{padding:50px 16px;}
  section.gray{background:var(--gray);}
  h2.section-title{
    text-align:center;
    font-size:1.6rem;
    margin-bottom:36px;
    position:relative;
  }
  h2.section-title::after{
    content:"";
    display:block;
    width:48px;
    height:4px;
    background:var(--yellow);
    margin:14px auto 0;
  }

  /* Worry boxes */
  .worry-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
  }
  .worry-box{
    background:#fff;
    border:2px solid #eee;
    border-radius:8px;
    padding:24px 16px;
    text-align:center;
    font-weight:bold;
  }

  /* Car showcase */
  .car-showcase{
    display:flex;
    align-items:center;
    gap:36px;
    background:#fff;
    border-radius:12px;
    padding:32px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    flex-wrap:wrap;
  }
  .car-illustration{flex:0 0 320px;max-width:100%;}
  .car-illustration svg{width:100%;height:auto;}
  .car-showcase-text{flex:1 1 260px;}
  .car-showcase-text h3{font-size:1.2rem;margin:0 0 12px;}
  .car-showcase-text p{margin:0;color:var(--darkgray);font-size:0.95rem;}
  .price-note{text-align:center;color:var(--darkgray);font-size:0.85rem;margin-top:16px;}

  /* Reasons */
  .reason{
    display:flex;
    gap:20px;
    align-items:flex-start;
    max-width:700px;
    margin:0 auto 28px;
  }
  .reason .num{
    flex:0 0 40px;
    height:40px;
    border-radius:50%;
    background:var(--red);
    color:#fff;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .reason h3{margin:0 0 6px;font-size:1.05rem;}
  .reason p{margin:0;color:var(--darkgray);font-size:0.92rem;}

  /* Flow */
  .flow-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
  }
  .flow-card{background:#fff;border-radius:8px;padding:24px 16px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center;}
  .flow-card .step{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--yellow);
    color:var(--black);
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 10px;
  }
  .flow-card h3{font-size:1rem;margin:0 0 8px;}
  .flow-card p{font-size:0.85rem;color:var(--darkgray);margin:0;}

  /* FAQ */
  .faq-item{
    max-width:760px;
    margin:0 auto 16px;
    background:#fff;
    border-radius:8px;
    padding:18px 20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .faq-item .q{font-weight:bold;margin-bottom:6px;}
  .faq-item .a{color:var(--darkgray);font-size:0.92rem;}

  /* Store info */
  .store-card{
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .store-card iframe{width:100%;height:300px;border:0;}
  table.store-table{width:100%;border-collapse:collapse;}
  table.store-table th,table.store-table td{
    padding:12px 16px;
    border-bottom:1px solid #eee;
    text-align:left;
    font-size:0.92rem;
  }
  table.store-table th{
    width:130px;
    background:var(--gray);
    font-weight:bold;
  }

  /* Contact form */
  .contact-form{
    max-width:600px;
    margin:0 auto;
    background:#fff;
    border-radius:8px;
    padding:28px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .contact-form label{display:block;font-weight:bold;margin:16px 0 6px;font-size:0.92rem;}
  .contact-form label:first-child{margin-top:0;}
  .contact-form .req{
    background:var(--red);
    color:#fff;
    font-size:0.7rem;
    padding:2px 8px;
    border-radius:10px;
    margin-left:6px;
    font-weight:normal;
  }
  .contact-form input,.contact-form textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:0.95rem;
    font-family:inherit;
  }
  .contact-form .form-submit{
    display:block;
    width:100%;
    border:none;
    cursor:pointer;
    margin-top:24px;
    text-align:center;
  }
  .contact-form .form-note{font-size:0.78rem;color:var(--darkgray);margin-top:12px;}

  /* Bottom CTA */
  .bottom-cta{
    background:var(--yellow);
    text-align:center;
    padding:40px 16px;
  }
  .bottom-cta h2{margin:0 0 16px;font-size:1.5rem;}
  .bottom-cta .tel-big{
    font-size:2.4rem;
    font-weight:bold;
    color:var(--black);
  }
  .bottom-cta .tel-big span{display:block;font-size:0.9rem;font-weight:normal;}
  .bottom-cta .mail-note{margin-top:14px;font-size:0.9rem;}

  footer{
    background:var(--black);
    color:#aaa;
    text-align:center;
    padding:24px 16px;
    font-size:0.8rem;
  }

  @media (max-width:700px){
    .worry-grid,.flow-grid{grid-template-columns:1fr;}
    .hero h1{font-size:1.4rem;}
    .car-showcase{flex-direction:column;text-align:center;padding:24px;}
  }
</style>
</head>
