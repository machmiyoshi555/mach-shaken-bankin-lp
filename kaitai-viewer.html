<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クルマ分解ビューア｜お客様説明用</title>
<style>
  :root{
    --bg:#EFF2F6; --panel:#FFFFFF; --ink:#1B2734; --muted:#5C6C7B;
    --line:#D8E0E8; --accent:#F25C1F; --accent-soft:#FDE8DE;
    --stage-from:#8FB4BE; --stage-to:#CFE3E6; --shadow:rgba(15,30,45,.28);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12181F; --panel:#1A222C; --ink:#ECF1F6; --muted:#93A2B1;
      --line:#2A3542; --accent:#FF6A2B; --accent-soft:#3A2317;
      --stage-from:#12262D; --stage-to:#24444E; --shadow:rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181F; --panel:#1A222C; --ink:#ECF1F6; --muted:#93A2B1;
    --line:#2A3542; --accent:#FF6A2B; --accent-soft:#3A2317;
    --stage-from:#12262D; --stage-to:#24444E; --shadow:rgba(0,0,0,.5);
  }
  :root[data-theme="light"]{
    --bg:#EFF2F6; --panel:#FFFFFF; --ink:#1B2734; --muted:#5C6C7B;
    --line:#D8E0E8; --accent:#F25C1F; --accent-soft:#FDE8DE;
    --stage-from:#8FB4BE; --stage-to:#CFE3E6; --shadow:rgba(15,30,45,.28);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #app{display:flex; flex-direction:column; gap:12px; padding:12px; max-width:1200px; margin:0 auto; min-height:100%}
  header{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding:2px 4px}
  header h1{font-size:1.15rem; margin:0; font-weight:700; letter-spacing:.02em}
  header .tag{font-size:.72rem; color:var(--muted); letter-spacing:.08em}
  header .hint{margin-left:auto; font-size:.75rem; color:var(--muted)}

  #stage{
    position:relative; height:52vh; min-height:300px; border-radius:14px;
    background:radial-gradient(120% 90% at 50% 20%, var(--stage-to), var(--stage-from));
    border:1px solid var(--line);
    overflow:hidden; touch-action:none; cursor:grab; perspective:1100px;
  }
  #stage.dragging{cursor:grabbing}
  #scene{
    position:absolute; left:50%; top:56%;
    transform-style:preserve-3d;
  }
  .obj{position:absolute; transform-style:preserve-3d}
  .face{
    position:absolute; left:0; top:0; pointer-events:auto;
    backface-visibility:visible;
  }
  .noclick, .noclick .face{pointer-events:none}
  .bodyshell .face{opacity:.2; pointer-events:none; transition:opacity .3s}
  .glass .face{opacity:.28; pointer-events:none; transition:opacity .3s}
  #scene.solid .bodyshell .face{opacity:1; pointer-events:auto}
  #scene.solid .glass .face{opacity:.85; pointer-events:auto}
  .sel .face{outline:3px solid var(--accent); animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{outline-color:transparent}}
  @media (prefers-reduced-motion: reduce){ .sel .face{animation:none} }

  #zoombar{position:absolute; right:10px; bottom:10px; display:flex; gap:8px}
  #zoombar button{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:1.15rem; font-weight:700; cursor:pointer;
  }
  #togglebar{position:absolute; left:10px; bottom:10px; display:flex; gap:8px}
  #togglebar button{
    height:44px; padding:0 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:.82rem; font-weight:600; cursor:pointer;
  }
  #togglebar button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}

  #info{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; min-height:96px;
  }
  #info .name{display:flex; align-items:center; gap:8px; font-size:1.05rem; font-weight:700; margin:0 0 4px}
  #info .dot{width:12px; height:12px; border-radius:50%; flex:none}
  #info p{margin:4px 0; font-size:.9rem; line-height:1.65; color:var(--ink)}
  #info .memo{
    display:inline-block; margin-top:6px; padding:4px 10px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent); font-size:.8rem; font-weight:700;
  }
  #info .placeholder{color:var(--muted)}

  #chips{display:flex; flex-direction:column; gap:10px; padding:2px 2px 8px}
  .grp-label{font-size:.72rem; font-weight:700; color:var(--muted); letter-spacing:.08em; margin-bottom:6px}
  .grp-row{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    flex:none; display:flex; align-items:center; gap:7px;
    height:44px; padding:0 14px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--panel); color:var(--ink);
    font-size:.88rem; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .chip .dot{width:11px; height:11px; border-radius:50%}
  .chip.active{border-color:var(--accent); background:var(--accent-soft)}
  footer{font-size:.7rem; color:var(--muted); text-align:center; padding-bottom:6px}

  @media (min-width: 920px){
    #app{display:grid; grid-template-columns:1fr 340px; grid-template-rows:auto 1fr auto; gap:14px}
    header{grid-column:1/3}
    #stage{grid-row:2; height:auto; min-height:480px}
    #side{grid-row:2; grid-column:2; display:flex; flex-direction:column; gap:12px; min-width:0}
    #chips{flex-wrap:wrap; overflow:visible}
    footer{grid-column:1/3}
  }
</style>

<div id="app">
  <header>
    <h1>クルマ分解ビューア</h1>
    <span class="tag">マッハ三好店｜お客様説明用</span>
    <span class="hint">スワイプで回転（上下も）・部品をタップで説明</span>
  </header>

  <div id="stage">
    <div id="scene"></div>
    <div id="togglebar">
      <button id="btnAuto" aria-pressed="true">自動回転</button>
      <button id="btnXray" aria-pressed="true">ボディ透過</button>
      <button id="btnUnder">下から見る</button>
    </div>
    <div id="zoombar">
      <button id="btnMinus" aria-label="縮小">－</button>
      <button id="btnPlus" aria-label="拡大">＋</button>
      <button id="btnReset" aria-label="向きをリセット">⌂</button>
    </div>
  </div>

  <div id="side">
    <div id="info">
      <p class="placeholder">気になる部品をタップ（クリック）すると、ここに説明が表示されます。</p>
    </div>
    <div id="chips"></div>
  </div>

  <footer>※説明用の簡易イメージです。実際のお車の形状・部品配置とは異なります。</footer>
</div>

<script>
(function(){
  var scene = document.getElementById('scene');
  var stage = document.getElementById('stage');

  var PARTS = {
    engine:{ name:'エンジン', color:'#E05A2B',
      desc:'クルマの心臓部。燃料を燃やして走る力を生み出します。調子が悪いと燃費や走りに直結します。',
      memo:'オイル・プラグ・ベルト類を定期点検' },
    oil:{ name:'エンジンオイル', color:'#B8791F',
      desc:'エンジン内部を守る「血液」のような存在。汚れたまま走るとエンジンの寿命を縮めます。',
      memo:'交換目安：5,000km または 6ヶ月ごと' },
    radiator:{ name:'ラジエーター・冷却水', color:'#3B7DD8',
      desc:'エンジンの熱を冷ます装置。冷却水（LLC）が減ったり古くなるとオーバーヒートの原因になります。',
      memo:'車検・点検ごとに量と汚れをチェック' },
    battery:{ name:'バッテリー', color:'#E8B71E',
      desc:'エンジン始動と電装品の電源。弱ってくると、ある日突然エンジンがかからなくなることも。',
      memo:'交換目安：2〜3年' },
    brake:{ name:'ブレーキ', color:'#CE3B4D',
      desc:'パッドがすり減ると効きが悪くなります。安全に直結する最重要部品のひとつです。',
      memo:'パッド残量 約3mm以下で交換推奨' },
    suspension:{ name:'サスペンション', color:'#7A5FC9',
      desc:'路面の衝撃を吸収して、乗り心地とハンドリングの安定を保ちます。',
      memo:'車検：オイル漏れ・異音・ガタを点検' },
    lowerarm:{ name:'ロアアーム', color:'#5F9E2F',
      desc:'タイヤを支える「腕」。段差の衝撃を受け止める足まわりの土台です。',
      memo:'車検：ブッシュのひび割れ・ボールジョイントのガタを点検' },
    tierod:{ name:'タイロッド', color:'#E76FA6',
      desc:'ステアリングの動きを車輪に伝える棒。ここが緩むとまっすぐ走れなくなります。',
      memo:'車検：エンドブーツの切れ・ガタは車検NG' },
    driveshaft:{ name:'ドライブシャフト', color:'#46627F',
      desc:'エンジンの力をタイヤへ伝える回転軸。両端のゴムブーツ（ジャバラ）が弱点です。',
      memo:'車検：ブーツの破れ・グリス漏れは車検NG' },
    steering:{ name:'ステアリング', color:'#17A28E',
      desc:'ハンドルの操作をタイヤの向きに変える装置。ハンドル・コラム・ギアボックスで構成されます。',
      memo:'車検：ガタ・ブーツの破れ・パワステオイル漏れを点検' },
    muffler:{ name:'マフラー', color:'#8B95A1',
      desc:'排気ガスを消音・浄化します。下回りは雨や融雪剤でサビやすい場所です。',
      memo:'車検：排気漏れ・腐食を点検' },
    tire:{ name:'タイヤ', color:'#3A3F45',
      desc:'路面に接する唯一の部品。溝が1.6mm未満（スリップサイン）だと車検に通りません。',
      memo:'車検：溝・ひび割れ・空気圧を点検' },
    mirror:{ name:'サイドミラー', color:'#607D8B',
      desc:'後方確認に必須の保安部品。割れや大きなガタがあると車検に通りません。',
      memo:'車検：鏡面の割れ・ガタ・取り付けの緩みを確認' },
    light:{ name:'ライト・灯火類', color:'#F0C24B',
      desc:'ヘッドライト・ウインカー・テールランプなど。夜間の安全と合図に必須です。',
      memo:'車検：全灯の点灯確認、ヘッドライトは光軸・光量を検査' }
  };

  var GROUPS = [
    { label:'エンジンルーム', ids:['engine','oil','radiator','battery'] },
    { label:'足まわり・下まわり', ids:['tire','brake','suspension','lowerarm','tierod','driveshaft','steering','muffler'] },
    { label:'ボディ・灯火', ids:['mirror','light'] }
  ];

  function el(cls){ var d=document.createElement('div'); d.className=cls; return d; }

  function makeBox(o){
    var b = el('obj ' + (o.cls||'')); b.className='obj '+(o.cls||'');
    b.style.transform='translate3d('+o.x+'px,'+o.y+'px,'+o.z+'px)'+(o.rot? ' '+o.rot : '');
    if(o.part) b.dataset.part=o.part;
    var faces=[
      ['rotateY(0deg)',    o.d/2, o.w, o.h, .96],
      ['rotateY(180deg)',  o.d/2, o.w, o.h, .96],
      ['rotateY(90deg)',   o.w/2, o.d, o.h, .82],
      ['rotateY(-90deg)',  o.w/2, o.d, o.h, .82],
      ['rotateX(90deg)',   o.h/2, o.w, o.d, 1.13],
      ['rotateX(-90deg)',  o.h/2, o.w, o.d, .6]
    ];
    for(var i=0;i<faces.length;i++){
      var f=faces[i], fd=el('face');
      fd.style.cssText='width:'+f[2]+'px;height:'+f[3]+'px;margin-left:'+(-f[2]/2)+'px;margin-top:'+(-f[3]/2)+
        'px;transform:'+f[0]+' translateZ('+f[1]+'px);background:'+o.color+';filter:brightness('+f[4]+')';
      b.appendChild(fd);
    }
    scene.appendChild(b);
    return b;
  }

  function makeDisc(o){
    var b=el('obj '+(o.cls||''));
    b.style.transform='translate3d('+o.x+'px,'+o.y+'px,'+o.z+'px)'+(o.rot? ' '+o.rot : '');
    if(o.part) b.dataset.part=o.part;
    var t=o.t||10;
    for(var s=-1;s<=1;s+=2){
      var f=el('face');
      f.style.cssText='width:'+(o.r*2)+'px;height:'+(o.r*2)+'px;margin-left:'+(-o.r)+'px;margin-top:'+(-o.r)+
        'px;border-radius:50%;transform:translateZ('+(s*t/2)+'px);background:'+o.bg;
      b.appendChild(f);
    }
    if(o.tread){ var seg=2*o.r*Math.tan(Math.PI/8);
      for(var k=0;k<8;k++){
        var st=el('face');
        st.style.cssText='width:'+seg+'px;height:'+t+'px;margin-left:'+(-seg/2)+'px;margin-top:'+(-t/2)+
          'px;transform:rotateZ('+(k*45)+'deg) translateY('+(-o.r)+'px) rotateX(90deg);background:'+o.tread;
        b.appendChild(st);
      }
    }
    scene.appendChild(b);
    return b;
  }

  var shadowFace;
  (function(){
    var sh=el('obj noclick'), f=el('face');
    f.style.cssText='width:460px;height:200px;margin-left:-230px;margin-top:-100px;border-radius:50%;'+
      'transform:rotateX(90deg);background:radial-gradient(closest-side, var(--shadow), transparent 72%);'+
      'transition:opacity .3s';
    sh.style.transform='translate3d(0,42px,0)';
    sh.appendChild(f); scene.appendChild(sh);
    shadowFace=f;
  })();

  makeBox({x:0,y:-15,z:0,    w:380,h:50,d:146, color:'#EEF1F4', cls:'bodyshell'});
  makeBox({x:132,y:-46,z:0,  w:105,h:12,d:140, color:'#EEF1F4', cls:'bodyshell'});
  makeBox({x:-155,y:-43,z:0, w:70,h:10,d:140,  color:'#EEF1F4', cls:'bodyshell'});
  makeBox({x:-30,y:-81,z:0,  w:150,h:6,d:116,  color:'#EEF1F4', cls:'bodyshell'});
  makeBox({x:62,y:-59,z:0,   w:52,h:5,d:112, color:'#9FBFD4', cls:'glass', rot:'rotateZ(47deg)'});
  makeBox({x:-112,y:-59,z:0, w:41,h:5,d:112, color:'#9FBFD4', cls:'glass', rot:'rotateZ(-68deg)'});
  makeBox({x:-30,y:-59,z:0,  w:150,h:38,d:108, color:'#9FBFD4', cls:'glass'});
  makeBox({x:190,y:-6,z:0,   w:10,h:20,d:150, color:'#DDE3E8', cls:'bodyshell'});
  makeBox({x:-190,y:-6,z:0,  w:10,h:20,d:150, color:'#DDE3E8', cls:'bodyshell'});

  makeBox({x:182,y:-46,z:52,  w:7,h:10,d:24, color:'#F5E9B8', part:'light'});
  makeBox({x:182,y:-46,z:-52, w:7,h:10,d:24, color:'#F5E9B8', part:'light'});
  makeBox({x:-186,y:-45,z:50,  w:6,h:10,d:20, color:'#D84343', part:'light'});
  makeBox({x:-186,y:-45,z:-50, w:6,h:10,d:20, color:'#D84343', part:'light'});

  makeBox({x:40,y:-46,z:60,  w:12,h:8,d:12, color:'#607D8B', part:'mirror'});
  makeBox({x:40,y:-46,z:-60, w:12,h:8,d:12, color:'#607D8B', part:'mirror'});

  makeDisc({x:30,y:-58,z:36, r:14, t:5, part:'steering',
    bg:'radial-gradient(circle, #17A28E 0 26%, transparent 27% 62%, #0E7264 63%)',
    rot:'rotateY(90deg) rotateX(20deg)'});
  makeBox({x:56,y:-32,z:36, w:74,h:6,d:6, color:'#17A28E', part:'steering', rot:'rotateZ(45deg)'});
  makeBox({x:82,y:-6,z:0,   w:9,h:9,d:76, color:'#0E7264', part:'steering'});

  makeBox({x:96,y:-2,z:54,  w:7,h:7,d:42, color:'#E76FA6', part:'tierod', rot:'rotateY(40deg)'});
  makeBox({x:96,y:-2,z:-54, w:7,h:7,d:42, color:'#E76FA6', part:'tierod', rot:'rotateY(-40deg)'});

  makeBox({x:118,y:14,z:52,  w:22,h:7,d:48, color:'#5F9E2F', part:'lowerarm'});
  makeBox({x:118,y:14,z:-52, w:22,h:7,d:48, color:'#5F9E2F', part:'lowerarm'});

  makeBox({x:118,y:-2,z:45,  w:9,h:9,d:54, color:'#46627F', part:'driveshaft'});
  makeBox({x:118,y:-2,z:-45, w:9,h:9,d:54, color:'#46627F', part:'driveshaft'});
  makeBox({x:118,y:-2,z:64,  w:13,h:13,d:12, color:'#31475C', part:'driveshaft'});
  makeBox({x:118,y:-2,z:-64, w:13,h:13,d:12, color:'#31475C', part:'driveshaft'});

  makeBox({x:-118,y:12,z:0, w:12,h:10,d:110, color:'#6E6394', part:'suspension'});

  makeBox({x:120,y:-16,z:0,  w:70,h:40,d:85, color:'#E05A2B', part:'engine'});
  makeBox({x:120,y:12,z:0,   w:54,h:14,d:48, color:'#B8791F', part:'oil'});
  makeBox({x:168,y:-18,z:0,  w:9,h:36,d:95,  color:'#3B7DD8', part:'radiator'});
  makeBox({x:85,y:-30,z:-42, w:34,h:24,d:38, color:'#E8B71E', part:'battery'});

  makeBox({x:-55,y:16,z:45,   w:170,h:8,d:8,  color:'#8B95A1', part:'muffler'});
  makeBox({x:-158,y:14,z:45,  w:56,h:18,d:26, color:'#8B95A1', part:'muffler'});
  makeBox({x:-192,y:15,z:45,  w:12,h:7,d:7,   color:'#6E7883', part:'muffler'});

  var WX=[118,-118], WZ=[84,-84];
  for(var i=0;i<2;i++){
    for(var j=0;j<2;j++){
      var x=WX[i], z=WZ[j], inz=z>0? z-22 : z+22;
      makeDisc({x:x,y:0,z:z, r:40, t:24, part:'tire',
        bg:'radial-gradient(circle, #A9B2BC 0 34%, #23272C 35%)', tread:'#23272C'});
      makeDisc({x:x,y:0,z:inz, r:22, t:6, part:'brake',
        bg:'radial-gradient(circle, #CE3B4D 0 30%, #C4CBD4 31%)'});
      makeBox({x:x, y:-16, z:z>0? z-26: z+26, w:14,h:52,d:14, part:'suspension',
        color:'repeating-linear-gradient(0deg, #7A5FC9 0 6px, #5A42A8 6px 12px)'});
    }
  }

  var rx=-18, ry=-32, auto=!matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fitZoom(){
    var r=stage.getBoundingClientRect();
    return Math.max(0.6, Math.min(1.7, Math.min(r.width/560, r.height/430)));
  }
  var zoom=fitZoom();
  var HOME={rx:-18, ry:-32};
  function apply(){
    scene.style.transform='scale('+zoom+') rotateX('+rx+'deg) rotateY('+ry+'deg)';
    if(shadowFace) shadowFace.style.opacity = rx>8 ? '0' : '1';
  }
  apply();
  addEventListener('resize', function(){ zoom=fitZoom(); apply(); });

  function tweenTo(trx, ms){
    var srx=rx, t0=performance.now();
    (function step(now){
      var t=Math.min(1,(now-t0)/ms), e=t*(2-t);
      rx=srx+(trx-srx)*e; apply();
      if(t<1) requestAnimationFrame(step);
    })(t0);
  }

  var dragging=false, px=0, py=0, moved=0;
  stage.addEventListener('pointerdown', function(e){
    dragging=true; moved=0; px=e.clientX; py=e.clientY;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx=e.clientX-px, dy=e.clientY-py;
    moved+=Math.abs(dx)+Math.abs(dy);
    ry+=dx*0.45;
    rx=Math.max(-85, Math.min(85, rx-dy*0.35));
    px=e.clientX; py=e.clientY;
    apply();
  });
  stage.addEventListener('pointerup', function(){ dragging=false; stage.classList.remove('dragging'); });
  stage.addEventListener('pointercancel', function(){ dragging=false; stage.classList.remove('dragging'); });

  (function loop(){
    if(auto && !dragging){ ry+=0.12; apply(); }
    requestAnimationFrame(loop);
  })();

  var info=document.getElementById('info');
  var chipsWrap=document.getElementById('chips');
  var current=null;

  function select(id){
    current=id;
    var objs=scene.querySelectorAll('.obj');
    for(var i=0;i<objs.length;i++){
      objs[i].classList.toggle('sel', objs[i].dataset.part===id);
    }
    var chips=chipsWrap.querySelectorAll('.chip');
    for(var i=0;i<chips.length;i++){
      chips[i].classList.toggle('active', chips[i].dataset.part===id);
    }
    var p=PARTS[id];
    info.innerHTML='<p class="name"><span class="dot" style="background:'+p.color+'"></span>'+p.name+'</p>'+
      '<p>'+p.desc+'</p><span class="memo">'+p.memo+'</span>';
  }

  stage.addEventListener('click', function(e){
    if(moved>8) return;
    var t=e.target.closest ? e.target.closest('[data-part]') : null;
    if(t) select(t.dataset.part);
  });

  GROUPS.forEach(function(g){
    var grp=document.createElement('div'); grp.className='grp';
    var lbl=document.createElement('div'); lbl.className='grp-label'; lbl.textContent=g.label;
    var row=document.createElement('div'); row.className='grp-row';
    g.ids.forEach(function(id){
      var c=document.createElement('button');
      c.className='chip'; c.dataset.part=id;
      c.innerHTML='<span class="dot" style="background:'+PARTS[id].color+'"></span>'+PARTS[id].name;
      c.addEventListener('click', function(){ select(id); });
      row.appendChild(c);
    });
    grp.appendChild(lbl); grp.appendChild(row);
    chipsWrap.appendChild(grp);
  });

  var btnAuto=document.getElementById('btnAuto');
  btnAuto.setAttribute('aria-pressed', String(auto));
  btnAuto.addEventListener('click', function(){
    auto=!auto; btnAuto.setAttribute('aria-pressed', String(auto));
  });
  var btnXray=document.getElementById('btnXray');
  btnXray.addEventListener('click', function(){
    var solid=scene.classList.toggle('solid');
    btnXray.setAttribute('aria-pressed', String(!solid));
  });
  document.getElementById('btnUnder').addEventListener('click', function(){ tweenTo(58, 500); });
  document.getElementById('btnPlus').addEventListener('click', function(){ zoom=Math.min(1.8, zoom+0.15); apply(); });
  document.getElementById('btnMinus').addEventListener('click', function(){ zoom=Math.max(0.5, zoom-0.15); apply(); });
  document.getElementById('btnReset').addEventListener('click', function(){ rx=HOME.rx; ry=HOME.ry; zoom=fitZoom(); apply(); });
})();
</script>
