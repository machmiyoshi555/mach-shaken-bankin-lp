<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クルマの症状診断Q&A｜お客様説明用</title>
<style>
  :root{
    --bg:#EFF2F6; --panel:#FFFFFF; --ink:#1B2734; --muted:#5C6C7B;
    --line:#D8E0E8; --accent:#F25C1F; --accent-soft:#FDE8DE;
    --shadow:rgba(15,30,45,.10);
    --high:#D93025; --high-soft:#FDE7E5;
    --mid:#B36A00;  --mid-soft:#FBEFDC;
    --low:#2E7D52;  --low-soft:#E3F3EA;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12181F; --panel:#1A222C; --ink:#ECF1F6; --muted:#93A2B1;
      --line:#2A3542; --accent:#FF6A2B; --accent-soft:#3A2317;
      --shadow:rgba(0,0,0,.45);
      --high:#FF8177; --high-soft:#3A1E1B;
      --mid:#E9A83C;  --mid-soft:#33270F;
      --low:#69C795;  --low-soft:#14301F;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181F; --panel:#1A222C; --ink:#ECF1F6; --muted:#93A2B1;
    --line:#2A3542; --accent:#FF6A2B; --accent-soft:#3A2317;
    --shadow:rgba(0,0,0,.45);
    --high:#FF8177; --high-soft:#3A1E1B;
    --mid:#E9A83C;  --mid-soft:#33270F;
    --low:#69C795;  --low-soft:#14301F;
  }
  :root[data-theme="light"]{
    --bg:#EFF2F6; --panel:#FFFFFF; --ink:#1B2734; --muted:#5C6C7B;
    --line:#D8E0E8; --accent:#F25C1F; --accent-soft:#FDE8DE;
    --shadow:rgba(15,30,45,.10);
    --high:#D93025; --high-soft:#FDE7E5;
    --mid:#B36A00;  --mid-soft:#FBEFDC;
    --low:#2E7D52;  --low-soft:#E3F3EA;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
    line-height:1.7;
  }
  #app{max-width:1180px; margin:0 auto; padding:16px 20px 40px}

  header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:6px 2px 14px}
  header h1{font-size:1.3rem; margin:0; font-weight:700; letter-spacing:.02em}
  header .tag{font-size:.75rem; color:var(--muted); letter-spacing:.08em}
  header .links{margin-left:auto; display:flex; gap:8px}
  header .links a, header .links button{
    font-size:.78rem; color:var(--muted); text-decoration:none; font-family:inherit;
    border:1px solid var(--line); background:var(--panel); border-radius:999px;
    padding:6px 12px; cursor:pointer;
  }
  header .links a:hover, header .links button:hover{border-color:var(--accent); color:var(--accent)}

  /* パンくず */
  #crumbs{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; min-height:34px}
  #crumbs .crumb{
    display:inline-flex; align-items:center; gap:6px; font-size:.82rem;
    padding:5px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); cursor:pointer; font-family:inherit;
  }
  #crumbs .crumb.done{color:var(--ink); border-color:var(--accent); background:var(--accent-soft)}
  #crumbs .crumb.now{color:var(--ink); font-weight:700}
  #crumbs .sep{color:var(--muted); font-size:.8rem}
  #crumbs .reset{margin-left:auto}

  .step-title{font-size:1.05rem; font-weight:700; margin:0 0 4px}
  .step-lead{font-size:.86rem; color:var(--muted); margin:0 0 16px}

  /* Step1 症状カテゴリ */
  .cat-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px}
  .cat{
    display:flex; align-items:flex-start; gap:12px; text-align:left;
    padding:16px; border-radius:14px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); cursor:pointer; font-family:inherit;
    box-shadow:0 1px 2px var(--shadow); transition:border-color .12s, transform .12s;
  }
  .cat:hover{border-color:var(--accent); transform:translateY(-1px)}
  .cat .ic{font-size:1.5rem; line-height:1.2; flex:none}
  .cat .txt{display:block; min-width:0}
  .cat .lb{display:block; font-size:.98rem; font-weight:700; margin-bottom:2px}
  .cat .hn{display:block; font-size:.78rem; color:var(--muted); line-height:1.5}

  /* Step2 選択肢 */
  .opt-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:10px}
  .opt{
    display:flex; align-items:center; gap:12px; text-align:left;
    padding:14px 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); cursor:pointer; font-family:inherit;
    box-shadow:0 1px 2px var(--shadow); transition:border-color .12s;
  }
  .opt:hover{border-color:var(--accent)}
  .opt .txt{flex:1; min-width:0}
  .opt .lb{display:block; font-size:.94rem; font-weight:700}
  .opt .nt{display:block; font-size:.78rem; color:var(--muted); margin-top:2px}
  .opt .arw{color:var(--muted); font-size:1rem; flex:none}

  /* Step3 結果 */
  #result-head{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 2px var(--shadow);
  }
  #result-head .sym{font-size:.76rem; color:var(--muted); letter-spacing:.06em; margin-bottom:4px}
  #result-head h2{margin:0; font-size:1.15rem; font-weight:700}
  #result-head .note{font-size:.82rem; color:var(--muted); margin:8px 0 0}

  .res-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(400px,1fr)); gap:12px}
  .res{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; box-shadow:0 1px 2px var(--shadow); position:relative;
    border-left:5px solid var(--line);
  }
  .res.u-high{border-left-color:var(--high)}
  .res.u-mid{border-left-color:var(--mid)}
  .res.u-low{border-left-color:var(--low)}
  .res .top{display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:8px}
  .res h3{margin:0; font-size:1rem; font-weight:700; flex:1; min-width:0}
  .badge{
    display:inline-flex; align-items:center; gap:5px; flex:none;
    font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .badge.u-high{background:var(--high-soft); color:var(--high)}
  .badge.u-mid{background:var(--mid-soft); color:var(--mid)}
  .badge.u-low{background:var(--low-soft); color:var(--low)}
  .area{display:inline-flex; align-items:center; gap:6px; font-size:.74rem; color:var(--muted); margin-bottom:10px}
  .area .dot{width:9px; height:9px; border-radius:50%; flex:none}
  .res dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:baseline}
  .res dt{
    font-size:.72rem; font-weight:700; color:var(--muted); white-space:nowrap;
    border:1px solid var(--line); border-radius:6px; padding:1px 7px; justify-self:start;
  }
  .res dd{margin:0; font-size:.86rem; line-height:1.65}
  .res dd.cost{font-weight:700}
  .res dd.risk{color:var(--high)}

  /* CTA */
  #cta{
    margin-top:18px; background:var(--panel); border:1px solid var(--line);
    border-left:5px solid var(--accent); border-radius:14px; padding:18px 20px;
    box-shadow:0 1px 2px var(--shadow);
  }
  #cta h3{margin:0 0 6px; font-size:1rem}
  #cta p{margin:0 0 10px; font-size:.86rem; color:var(--muted)}
  #cta .tel{font-size:1.35rem; font-weight:700; color:var(--accent); letter-spacing:.03em; text-decoration:none}
  #cta .tel small{display:inline-block; font-size:.75rem; color:var(--muted); font-weight:400; margin-left:8px; letter-spacing:0}

  .backrow{margin-top:20px; display:flex; gap:10px; flex-wrap:wrap}
  .backrow button{
    font-family:inherit; font-size:.85rem; font-weight:600; cursor:pointer;
    padding:10px 18px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink);
  }
  .backrow button:hover{border-color:var(--accent); color:var(--accent)}

  footer{margin-top:28px; font-size:.72rem; color:var(--muted); line-height:1.8; text-align:center}

  @media print{
    body{background:#fff}
    header .links, .backrow, #crumbs .reset{display:none}
    .res, #result-head, #cta{box-shadow:none; break-inside:avoid}
    .res-grid{grid-template-columns:1fr 1fr}
  }
</style>

<div id="app">
  <header>
    <h1>クルマの症状診断Q&amp;A</h1>
    <span class="tag">マッハ車検 愛知三好店｜一般整備・お客様説明用</span>
    <span class="links">
      <a href="kaitai-viewer.html">分解ビューアを開く</a>
      <button id="btnPrint">この画面を印刷</button>
    </span>
  </header>

  <nav id="crumbs"></nav>
  <main id="main"></main>

  <footer>
    表示している費用は一般的な目安です。車種・年式・部品の状態によって変わりますので、実際のお見積りは点検後にご案内します。<br>
    マッハ車検 愛知三好店（みよし市）　TEL 0561-76-3555
  </footer>
</div>

<script>
"use strict";

const AREAS = {
  engine: { label:"エンジンルーム",     c:"#E4572E" },
  under:  { label:"足まわり・下まわり", c:"#2E86AB" },
  cabin:  { label:"室内・電装",         c:"#7B54B3" },
  body:   { label:"ボディ・外まわり",   c:"#3F8F5E" }
};
const URG = {
  high: { label:"すぐ点検を",     cls:"u-high" },
  mid:  { label:"早めに点検",     cls:"u-mid"  },
  low:  { label:"次回整備で相談", cls:"u-low"  }
};

function r(p,a,u,why,check,cost,risk){ return {p,a,u,why,check,cost,risk}; }

const CATS = [];

CATS.push({ id:"noise", ic:"🔊", lb:"異音がする", hn:"キーキー・ガタガタ・カラカラなど",
  q:"どんな時に音が出ますか？",
  opts:[
    { lb:"エンジンをかけた時・アイドリング中", nt:"ボンネットの中から聞こえる",
      res:[
        r("ファンベルト・補機ベルトの劣化","engine","mid",
          "始動直後やエアコンを入れた時の「キュルキュル」音は、ベルトが硬化・摩耗して滑っているサインです。冷えている朝に鳴きやすいのが特徴です。",
          "ベルトのひび割れ・張り具合、プーリーのガタつきを点検します。",
          "ベルト交換 6,000〜18,000円前後（本数・車種による）",
          "切れると発電・冷却・パワステが同時に止まり、その場で走行不能になります。"),
        r("エンジンオイルの劣化・量不足","engine","high",
          "「カタカタ」「ガラガラ」という打音は、オイルが減った・汚れたことで内部の潤滑が足りていない時に出ます。",
          "オイルの量と汚れ、油圧警告灯の点灯有無、にじみ漏れを点検します。",
          "オイル交換 4,000〜8,000円前後（+オイルエレメント 1,500円前後）",
          "そのまま走るとエンジンが焼き付き、載せ替えで数十万円かかることがあります。"),
        r("スパークプラグ・点火系の劣化","engine","mid",
          "ブルブルと震えるような不規則な振動音は、プラグやイグニッションコイルが弱っているときの症状です。",
          "プラグの焼け具合、診断機でのエラーコード確認を行います。",
          "プラグ交換 6,000〜22,000円前後（本数・脱着工数による）"),
        r("ウォーターポンプ・オルタネーターなど補機の軸受け","engine","high",
          "回転に合わせて「ウィーン」「ゴロゴロ」と続く音は、補機のベアリング摩耗が疑われます。",
          "エンジン停止時のプーリーのガタ、異音の発生箇所を聴診器で特定します。",
          "部位により 20,000〜80,000円前後",
          "ウォーターポンプが壊れるとオーバーヒートにつながります。")
      ]},
    { lb:"ブレーキを踏んだ時", nt:"キーッ、ゴーという金属音",
      res:[
        r("ブレーキパッドの摩耗（警告金具の音）","under","high",
          "「キーッ」という高い金属音は、パッドが減って警告用の金具がディスクに当たっている音です。交換時期のお知らせです。",
          "パッド残量、ディスクの段付き・厚みを測定します。",
          "パッド交換 8,000〜22,000円前後／1軸",
          "さらに減ると金属同士が擦れてディスクまで傷み、費用が2倍以上になります。"),
        r("ブレーキローターの錆・段付き摩耗","under","mid",
          "雨の翌日や長期間動かした後に「ゴー」と鳴る場合は、ローター表面の錆や偏摩耗が原因のことがあります。",
          "ローターの厚み・振れ・表面状態を確認します。",
          "研磨または交換 15,000〜45,000円前後／1軸"),
        r("パッドの鳴き（グリス切れ・面取り不足）","under","low",
          "残量が十分なのに鳴く場合は、パッド当たり面のグリス切れや微振動が原因です。整備で収まることが多い症状です。",
          "パッドを外して面取り・鳴き止め処理を行います。",
          "鳴き止め処理 3,000〜6,000円前後")
      ]},
    { lb:"段差やカーブで「ゴトゴト」", nt:"足まわりから、走行中に",
      res:[
        r("スタビライザーリンク・ブッシュのガタ","under","mid",
          "段差を越えた時だけ「コトコト」鳴るのは、ゴム部品やリンクのガタつきが最も多い原因です。",
          "リフトアップして各リンク・ブッシュを揺すって遊びを確認します。",
          "リンク交換 8,000〜18,000円前後"),
        r("ショックアブソーバーのへたり","under","mid",
          "10万km前後で減衰力が落ち、突き上げ感やフワつき、段差での打音が出ます。",
          "オイルのにじみ、バウンドテストで減衰力を確認します。",
          "1本 12,000〜30,000円前後（左右セットでの交換を推奨）"),
        r("ロアアーム ボールジョイントの摩耗","under","high",
          "ジョイントのガタは異音とハンドルのふらつきを伴います。車検でも重要保安部品として見る箇所です。",
          "ブーツの破れ、ジョイントの上下方向の遊びを点検します。",
          "片側 15,000〜40,000円前後",
          "最悪の場合ジョイントが外れ、タイヤが折れるように傾いて走行不能になります。"),
        r("マフラーの吊りゴム切れ・遮熱板の共振","under","low",
          "特定の回転数だけ「ビビビ」と鳴る場合は、遮熱板や吊りゴムなどの軽微な原因が多いです。",
          "下まわりを目視で確認し、吊りゴム・遮熱板を点検します。",
          "吊りゴム交換 2,000〜6,000円前後")
      ]},
    { lb:"ハンドルを切った時", nt:"低速で曲がるとカラカラ・ウーン",
      res:[
        r("ドライブシャフト ブーツ破れ・ジョイント摩耗","under","high",
          "ハンドルをいっぱいに切って低速で曲がると「カラカラカラ」と鳴るのは、FF車の典型的な症状です。ブーツが破れてグリスが抜け、ジョイントが摩耗しています。",
          "ブーツの破れとグリス飛散、ジョイントのガタを点検します。",
          "ブーツ交換 12,000〜25,000円前後／シャフト交換 30,000〜70,000円前後",
          "ジョイントが破損すると駆動が伝わらず、走行不能になります。"),
        r("パワーステアリングの不調（フルード不足・ポンプ）","engine","mid",
          "「ウーン」という唸り音とハンドルの重さが同時に出る場合は、パワステフルードの不足やポンプの弱りが疑われます。",
          "フルード量・汚れ、漏れ箇所、ポンプの作動音を点検します。",
          "フルード交換 5,000〜12,000円前後／ポンプ交換 40,000円〜"),
        r("タイロッドエンド・ステアリングラックのガタ","under","mid",
          "ハンドル操作に対して「ゴトッ」と遊びがある場合、ステアリング系の連結部が摩耗しています。",
          "ハンドルの遊び量、ラックブーツ、各ジョイントを点検します。",
          "タイロッドエンド 12,000〜28,000円前後")
      ]},
    { lb:"走行中ずっと・加速すると鳴る", nt:"速度に合わせて音が大きくなる",
      res:[
        r("ハブベアリングの摩耗","under","high",
          "速度に比例して「ゴー」「ウォーン」と大きくなる音は、車輪の軸受け（ハブベアリング）の摩耗が代表的です。",
          "リフトアップしてタイヤを回し、ベアリングの音とガタを確認します。",
          "片側 25,000〜60,000円前後",
          "焼き付くとタイヤがロックする危険があります。"),
        r("タイヤの偏摩耗によるロードノイズ","under","mid",
          "ギザギザに片減りしたタイヤは「ゴー」というノイズが増えます。空気圧やアライメントの狂いが背景にあります。",
          "残溝の測定、摩耗の偏り、空気圧を点検します。",
          "タイヤ4本 40,000円〜／アライメント調整 12,000〜25,000円前後"),
        r("マフラーの穴あき・触媒の詰まり","under","mid",
          "「ボボボ」という排気音の変化は、腐食による穴あきが原因です。車検にも通りません。",
          "下まわりの目視・排気漏れ点検を行います。",
          "溶接補修 8,000〜20,000円前後／交換 30,000円〜")
      ]},
    { lb:"エアコンを入れると鳴る", nt:"A/Cのスイッチと連動する",
      res:[
        r("エアコンベルトの緩み・劣化","engine","mid",
          "A/Cを入れた瞬間に「キュルルル」と鳴くのは、負荷が増えてベルトが滑っている状態です。",
          "ベルトの張りとひび、テンショナーを点検します。",
          "ベルト交換 6,000〜15,000円前後"),
        r("エアコンコンプレッサーのクラッチ・軸受け","engine","mid",
          "「ガラガラ」「ゴロゴロ」という音がA/C作動時だけ出る場合は、コンプレッサー本体の傷みが疑われます。",
          "作動時の異音、クラッチの隙間、ガス圧を点検します。",
          "コンプレッサー交換 60,000〜150,000円前後"),
        r("ブロアモーターへの異物・ベアリング摩耗","cabin","low",
          "室内の助手席足元から「カラカラ」「バサバサ」と鳴る場合は、落ち葉などの異物やモーターの傷みです。",
          "エアコンフィルターとブロアモーターを取り外して確認します。",
          "清掃 3,000〜8,000円前後／モーター交換 20,000〜45,000円前後")
      ]}
  ]});

CATS.push({ id:"lamp", ic:"⚠️", lb:"警告灯がついた", hn:"メーターに見慣れないマークが出た",
  q:"点いているのはどのマークですか？",
  opts:[
    { lb:"赤い「油差し」のマーク", nt:"油圧警告灯｜最も緊急度が高い表示です",
      res:[
        r("エンジン油圧の低下（オイル不足・漏れ・ポンプ不良）","engine","high",
          "エンジン内部にオイルが回っていない状態を示します。走り続けると数分で深刻な損傷になります。",
          "まず安全な場所に停めてエンジンを切ってください。オイル量・漏れ・油圧を点検します。",
          "オイル補充・交換 4,000〜8,000円前後（原因により追加）",
          "走行を続けるとエンジンが焼き付き、載せ替えで数十万円かかります。自走せずご連絡ください。")
      ]},

          "製造年週とひび割れの深さを確認します。",
          "タイヤ交換 10,000円〜／1本")
      ]},
    { lb:"ふらつく・突き上げがきつい", nt:"乗り心地が変わった",
      res:[
        r("ショックアブソーバーのへたり","under","mid",
          "10万km前後で減衰力が落ち、段差でフワフワしたり突き上げが強くなります。",
          "オイル漏れとバウンドテストで判定します。",
          "1本 12,000〜30,000円前後（左右セット推奨）"),
        r("空気圧の過多・不足","under","low",
          "空気を入れすぎると突き上げが強くなり、少なすぎるとふらつきます。",
          "指定空気圧に調整します。",
          "空気圧調整 無料"),
        r("ブッシュ類の劣化","under","mid",
          "ゴムブッシュが硬化・破断すると、路面からの入力がそのまま伝わり乗り心地が悪化します。",
          "各ブッシュのひび・切れを点検します。",
          "交換 10,000〜40,000円前後／箇所")
      ]}
  ]});

/* ===== 画面の描画 ===== */
const main = document.getElementById("main");
const crumbs = document.getElementById("crumbs");
let state = { cat:null, opt:null };

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function renderCrumbs(){
  crumbs.innerHTML = "";
  const steps = [
    { lb:"1. 症状を選ぶ", on:()=>{ state={cat:null,opt:null}; render(); }, state: state.cat ? "done":"now" },
    { lb: state.cat ? "2. " + state.cat.lb : "2. 詳しい状況",
      on:()=>{ if(state.cat && state.cat.opts){ state.opt=null; render(); } },
      state: !state.cat ? "" : (state.opt ? "done" : "now") },
    { lb:"3. 考えられる原因", on:null, state: state.opt || (state.cat && !state.cat.opts) ? "now" : "" }
  ];
  steps.forEach((s,i)=>{
    if(i) crumbs.appendChild(el("span","sep","›"));
    const b = el("button","crumb" + (s.state ? " "+s.state : ""), esc(s.lb));
    if(s.on) b.onclick = s.on; else b.style.cursor = "default";
    crumbs.appendChild(b);
  });
  const rs = el("button","crumb reset","最初からやり直す");
  rs.onclick = ()=>{ state={cat:null,opt:null}; render(); };
  crumbs.appendChild(rs);
}

function renderStep1(){
  main.appendChild(el("h2","step-title","気になる症状をお選びください"));
  main.appendChild(el("p","step-lead","当てはまるものをクリックすると、考えられる原因・点検内容・費用の目安をご案内します。"));
  const grid = el("div","cat-grid");
  CATS.forEach(c=>{
    const b = el("button","cat");
    b.innerHTML = '<span class="ic">'+c.ic+'</span><span class="txt"><span class="lb">'+esc(c.lb)+'</span><span class="hn">'+esc(c.hn)+'</span></span>';
    b.onclick = ()=>{ state.cat = c; state.opt = null; if(!c.opts) state.opt = {lb:c.lb, res:c.res}; render(); };
    grid.appendChild(b);
  });
  main.appendChild(grid);
}

function renderStep2(){
  const c = state.cat;
  main.appendChild(el("h2","step-title", c.ic + " " + esc(c.lb)));
  main.appendChild(el("p","step-lead", esc(c.q)));
  const list = el("div","opt-list");
  c.opts.forEach(o=>{
    const b = el("button","opt");
    b.innerHTML = '<span class="txt"><span class="lb">'+esc(o.lb)+'</span>'+(o.nt?'<span class="nt">'+esc(o.nt)+'</span>':'')+'</span><span class="arw">›</span>';
    b.onclick = ()=>{ state.opt = o; render(); };
    list.appendChild(b);
  });
  main.appendChild(list);
  main.appendChild(backRow([["症状の選択に戻る", ()=>{ state={cat:null,opt:null}; render(); }]]));
}

function resCard(x){
  const a = AREAS[x.a] || AREAS.engine;
  const u = URG[x.u] || URG.mid;
  const card = el("div","res "+u.cls);
  const top = el("div","top");
  top.appendChild(el("h3",null,esc(x.p)));
  top.appendChild(el("span","badge "+u.cls, esc(u.label)));
  card.appendChild(top);
  card.appendChild(el("div","area",'<span class="dot" style="background:'+a.c+'"></span>'+esc(a.label)));
  const dl = el("dl");
  const rows = [["症状の理由", x.why, ""], ["当店の点検", x.check, ""], ["費用の目安", x.cost, "cost"]];
  if(x.risk) rows.push(["放置すると", x.risk, "risk"]);
  rows.forEach(([k,v,cls])=>{
    if(!v) return;
    dl.appendChild(el("dt",null,esc(k)));
    dl.appendChild(el("dd",cls,esc(v)));
  });
  card.appendChild(dl);
  return card;
}

function renderStep3(){
  const c = state.cat, o = state.opt;
  const head = el("div"); head.id = "result-head";
  head.appendChild(el("div","sym","お伺いした症状"));
  head.appendChild(el("h2", null, c.ic + " " + esc(c.lb) + (c.opts ? "　/　" + esc(o.lb) : "")));
  head.appendChild(el("p","note","考えられる原因を、緊急度の高い順に並べています。実際の原因は点検で確定しますので、あくまで目安としてご覧ください。"));
  main.appendChild(head);

  const order = { high:0, mid:1, low:2 };
  const list = (o.res||[]).slice().sort((a,b)=> (order[a.u]??1) - (order[b.u]??1));
  const grid = el("div","res-grid");
  list.forEach(x=> grid.appendChild(resCard(x)));
  main.appendChild(grid);

  const cta = el("div"); cta.id = "cta";
  const urgent = list.some(x=> x.u === "high");
  cta.innerHTML =
    "<h3>" + (urgent ? "早めの点検をおすすめします" : "点検・お見積りは無料です") + "</h3>" +
    "<p>" + (urgent
      ? "上のうち赤い表示の項目は、そのまま乗り続けると走行不能や安全上のリスクにつながります。まずは現車を見せてください。"
      : "実際の状態を見て、必要な整備と費用をその場でご説明します。すぐ直すべきか、次回でよいかもはっきりお伝えします。") + "</p>" +
    '<a class="tel" href="tel:0561763555">0561-76-3555<small>マッハ車検 愛知三好店（みよし市）</small></a>';
  main.appendChild(cta);

  main.appendChild(backRow([
    ["症状を選び直す", ()=>{ if(c.opts){ state.opt=null; } else { state.cat=null; state.opt=null; } render(); }],
    ["最初からやり直す", ()=>{ state={cat:null,opt:null}; render(); }],
    ["この画面を印刷", ()=> window.print()]
  ]));
}

function backRow(items){
  const row = el("div","backrow");
  items.forEach(([lb,fn])=>{
    const b = el("button",null,esc(lb));
    b.onclick = fn;
    row.appendChild(b);
  });
  return row;
}

function render(){
  main.innerHTML = "";
  renderCrumbs();
  if(!state.cat) renderStep1();
  else if(!state.opt) { if(state.cat.opts) renderStep2(); else renderStep1(); }
  else renderStep3();
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("btnPrint").onclick = ()=> window.print();
render();
</script>
